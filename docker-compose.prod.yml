services:
  backend:
    ports: []
    restart: unless-stopped

  frontend:
    ports: []
    restart: unless-stopped

  db:
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
