services:
  backend:
    ports: []
    restart: unless-stopped

  frontend:
    ports: []
    restart: unless-stopped

  db:
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ~/caddy-certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - frontend
      - varnish

  # Moved here from the Istanbul VM (sudoperiba's docker-compose.yaml) so
  # Caddy can reach it over a local hop instead of Tailscale on every
  # request. VCL config (config/varnish/default.vcl) still needs to reach
  # storefront-gateway/rustfs-proxy on Istanbul, now over Tailscale instead
  # of Docker's local network — see the TODOs in that file before deploying.
  varnish:
    image: varnish:7.4
    restart: always
    volumes:
      - ./config/varnish/default.vcl:/etc/varnish/default.vcl:ro
      - varnish_vsm:/var/lib/varnish
    environment:
      - VARNISH_SIZE=512M
    command: >
      varnishd -F
      -f /etc/varnish/default.vcl
      -s malloc,512M
      -a :80
      -n /var/lib/varnish
    # Varnish had no host port mapping at all after the move — only Caddy
    # owns 80/443 here, so varnish-invalidator's PURGE requests to
    # 100.115.175.6:80 were silently hitting Caddy's HTTP->HTTPS redirect
    # instead of Varnish, and never actually purging anything. Bind only
    # to this box's Tailscale interface (same pattern as varnish-exporter
    # below) — sudoperiba's docker-compose.yaml needs VARNISH_PORT updated
    # to 6081 to match.
    ports:
      - "100.115.175.6:6081:80"
    healthcheck:
      test: ["CMD", "varnishadm", "-n", "/var/lib/varnish", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reads Varnish's VSM shared memory, so it must stay on the same host and
  # share the same volume — see varnish_vsm below. Prometheus (on the NAS)
  # needs its scrape target updated to this box's Tailscale IP once this is
  # live — see sudoperiba's config/prometheus.yml.
  #
  # Pulled from the NAS's registry (same one sudoperiba/scripts/
  # push_all_images.sh pushes every other service image to) — this box has
  # no local build context for varnish-exporter's Rust source, unlike
  # Istanbul which builds it in place.
  varnish-exporter:
    image: kasakurt.tailddabea.ts.net:5050/varnish-exporter:0.1.0
    restart: always
    volumes:
      - varnish_vsm:/var/lib/varnish:ro
    command:
      - "-n"
      - "/var/lib/varnish"
    depends_on:
      - varnish
    # Bind only to this box's Tailscale interface, not 0.0.0.0 — this
    # endpoint has no auth and shouldn't be reachable from the public
    # internet. 100.115.175.6 is this box's own Tailscale IP — same
    # address the NAS's prometheus.yml scrapes.
    ports:
      - "100.115.175.6:9131:9131"

  # Ships varnish-exporter's metrics to the NAS's Prometheus, which cannot
  # reach this box on its own: the NAS's Tailscale runs in userspace mode
  # (no kernel TUN device, confirmed via `ip route | grep 100.64` returning
  # nothing on the NAS host itself), so nothing running on the NAS — the
  # Prometheus container included, even with network_mode: host — can dial
  # out to any tailnet peer, this one included. Every existing NAS
  # integration (Loki, Tempo) works around this the same way: push
  # NAS-ward instead of having the NAS pull. This does the same for
  # metrics via Prometheus remote-write, which the NAS's Prometheus already
  # has enabled (`--web.enable-remote-write-receiver`, see
  # scripts/nas-monitoring-compose.yaml in sudoperiba) for exactly this
  # purpose (Tempo's metrics_generator already pushes to it that way).
  alloy:
    image: grafana/alloy:v1.5.1
    restart: always
    volumes:
      - ./config/alloy-varnish.alloy:/etc/alloy/config.alloy:ro
    # Alloy's own HTTP server (config UI, /-/ready, /-/reload) is not
    # exposed to anything here — no other service in this file calls it
    # and no port mapping is published for it. Bound to loopback only, not
    # 0.0.0.0, so it can't be reached from the container network either;
    # nothing needs it, so nothing should be able to reach it.
    command:
      - "run"
      - "--server.http.listen-addr=127.0.0.1:12345"
      - "--stability.level=public-preview"
      - "/etc/alloy/config.alloy"
    depends_on:
      - varnish-exporter

volumes:
  caddy_data:
  caddy_config:
  varnish_vsm:
